<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Arial, Helvetica, sans-serif">
  <!-- Fondo -->
  <rect width="640" height="560" fill="#ffffff"/>

  <!-- Arco Norte: Zona Norte hasta Tigre -->
  <path d="M405 142.8 A170 170 0 0 0 235 142.8" fill="none" stroke="#9db6cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <circle cx="405" cy="142.8" r="4" fill="#f97316"/>
  <circle cx="235" cy="142.8" r="4" fill="#f97316"/>
  <text x="320" y="88" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#0e2a47">ZONA NORTE</text>
  <text x="320" y="108" text-anchor="middle" font-size="12" fill="#5c6c7d">hasta Tigre</text>

  <!-- Arco Sur: Zona Sur hasta Canning / Quilmes -->
  <path d="M235 437.2 A170 170 0 0 0 405 437.2" fill="none" stroke="#9db6cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <circle cx="235" cy="437.2" r="4" fill="#f97316"/>
  <circle cx="405" cy="437.2" r="4" fill="#f97316"/>
  <text x="320" y="488" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1" fill="#0e2a47">ZONA SUR</text>
  <text x="320" y="508" text-anchor="middle" font-size="12" fill="#5c6c7d">hasta Canning / Quilmes</text>

  <!-- Arco Oeste: Zona Oeste hasta Moreno / San Miguel -->
  <path d="M221 191 A140 140 0 0 0 221 389" fill="none" stroke="#9db6cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <circle cx="221" cy="191" r="4" fill="#f97316"/>
  <circle cx="221" cy="389" r="4" fill="#f97316"/>
  <text x="24" y="270" font-size="15" font-weight="700" letter-spacing="1" fill="#0e2a47">ZONA OESTE</text>
  <text x="24" y="292" font-size="12" fill="#5c6c7d">hasta Moreno / San Miguel</text>

  <!-- Arco Este: CABA -->
  <path d="M423.9 350 A120 120 0 0 0 423.9 230" fill="none" stroke="#9db6cf" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <circle cx="423.9" cy="350" r="4" fill="#f97316"/>
  <circle cx="423.9" cy="230" r="4" fill="#f97316"/>
  <text x="616" y="270" text-anchor="end" font-size="15" font-weight="700" letter-spacing="1" fill="#0e2a47">CABA</text>
  <text x="616" y="292" text-anchor="end" font-size="12" fill="#5c6c7d">toda la ciudad</text>

  <!-- Centro: base de operaciones -->
  <circle cx="320" cy="290" r="16" fill="none" stroke="#0e2a47" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="320" cy="290" r="8" fill="#0e2a47"/>
  <rect x="243" y="318" width="154" height="46" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="320" y="337" text-anchor="middle" font-size="14" font-weight="700" fill="#0e2a47">El Palomar</text>
  <text x="320" y="354" text-anchor="middle" font-size="11" fill="#5c6c7d">base de operaciones</text>

  <!-- Pie -->
  <text x="320" y="548" text-anchor="middle" font-size="10.5" fill="#94a3b8">Mapa esquemático de cobertura — no a escala</text>
</svg>
