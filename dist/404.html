<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Página no encontrada | N/D Service Reparaciones</title>
    <meta name="robots" content="noindex" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f6f8fb;
        color: #1d2b3a;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 48px 32px;
        max-width: 460px;
        box-shadow: 0 18px 36px -18px rgba(14, 42, 71, 0.28);
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        color: #0e2a47;
        line-height: 1;
      }
      .code span { color: #f97316; }
      h1 { font-size: 1.3rem; margin: 18px 0 10px; color: #0e2a47; }
      p { color: #5c6c7d; font-size: 0.98rem; line-height: 1.55; }
      .ctas { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 13px 22px;
        border-radius: 999px;
      }
      .btn-primary { background: #f97316; color: #fff; }
      .btn-primary:hover { background: #d95f07; }
      .btn-ghost { background: #fff; color: #0e2a47; border: 2px solid #e2e8f0; }
      .btn-ghost:hover { border-color: #0e2a47; }
      .brand { margin-top: 28px; font-size: 0.85rem; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code" aria-hidden="true">4<span>0</span>4</div>
      <h1>Esta página no existe… pero tu electrodoméstico sí la arreglamos</h1>
      <p>
        Si venías buscando un service técnico, volvés a la home y te mostramos todo lo que
        reparamos.
      </p>
      <div class="ctas">
        <a class="btn btn-primary" href="./">Volver al inicio</a>
        <a class="btn btn-ghost" href="./#servicios">Ver servicios</a>
      </div>
      <p class="brand">N/D Service Reparaciones · El Palomar, Buenos Aires</p>
    </main>
  </body>
</html>
