<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Lavarropas">
  <title>Lavarropas</title>
  <!-- cuerpo -->
  <rect x="4" y="3" width="24" height="25" rx="3" fill="#eef4fb" stroke="#0e2a47" stroke-width="1.5"/>
  <!-- tablero superior -->
  <line x1="4" y1="9.5" x2="28" y2="9.5" stroke="#0e2a47" stroke-width="1.5"/>
  <circle cx="8" cy="6.25" r="1.75" fill="#0e2a47"/>
  <circle cx="21" cy="6.25" r="1.25" fill="#0e2a47" opacity="0.35"/>
  <circle cx="25" cy="6.25" r="1.5" fill="#f97316"/>
  <!-- puerta con tambor -->
  <circle cx="16" cy="19" r="7.25" fill="#ffffff" stroke="#0e2a47" stroke-width="1.5"/>
  <circle cx="16" cy="19" r="4.6" fill="#d8e7f7" stroke="#0e2a47" stroke-width="1.25"/>
  <!-- agua en el tambor -->
  <path d="M12.8 19.6c1.07-1.4 2.13-1.4 3.2 0s2.13 1.4 3.2 0" fill="none" stroke="#0e2a47" stroke-width="1.25" stroke-linecap="round"/>
  <!-- patas -->
  <rect x="7" y="28" width="3" height="2" rx="1" fill="#0e2a47"/>
  <rect x="22" y="28" width="3" height="2" rx="1" fill="#0e2a47"/>
</svg>
