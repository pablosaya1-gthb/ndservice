<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Microondas">
  <title>Microondas</title>
  <!-- cuerpo -->
  <rect x="2.5" y="6.5" width="27" height="19" rx="2.5" fill="#eef4fb" stroke="#0e2a47" stroke-width="1.5"/>
  <!-- puerta -->
  <rect x="5" y="9" width="16" height="14" rx="1.5" fill="#ffffff" stroke="#0e2a47" stroke-width="1.3"/>
  <rect x="7.2" y="11" width="11.6" height="10" rx="1" fill="#d8e7f7"/>
  <circle cx="13" cy="16" r="2.7" fill="#ffffff" stroke="#0e2a47" stroke-width="1.1"/>
  <!-- tirador -->
  <line x1="19.2" y1="11" x2="19.2" y2="21" stroke="#0e2a47" stroke-width="1.5" stroke-linecap="round"/>
  <!-- panel de control -->
  <rect x="22.8" y="9.5" width="5.4" height="3" rx="0.75" fill="#0e2a47"/>
  <circle cx="24.6" cy="15.5" r="1" fill="#0e2a47" opacity="0.35"/>
  <circle cx="27" cy="15.5" r="1" fill="#0e2a47" opacity="0.35"/>
  <circle cx="24.6" cy="18.8" r="1" fill="#0e2a47" opacity="0.35"/>
  <circle cx="27" cy="18.8" r="1.1" fill="#f97316"/>
  <!-- patas -->
  <rect x="5.5" y="25.5" width="3" height="2" rx="1" fill="#0e2a47"/>
  <rect x="23.5" y="25.5" width="3" height="2" rx="1" fill="#0e2a47"/>
</svg>
