<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Lavavajillas">
  <title>Lavavajillas</title>
  <!-- cuerpo -->
  <rect x="4" y="3" width="24" height="25" rx="3" fill="#eef4fb" stroke="#0e2a47" stroke-width="1.5"/>
  <!-- tablero superior -->
  <line x1="4" y1="9.5" x2="28" y2="9.5" stroke="#0e2a47" stroke-width="1.5"/>
  <circle cx="8" cy="6.25" r="1.75" fill="#0e2a47"/>
  <circle cx="21" cy="6.25" r="1.25" fill="#0e2a47" opacity="0.35"/>
  <circle cx="25" cy="6.25" r="1.5" fill="#f97316"/>
  <!-- tirador -->
  <rect x="7" y="11.75" width="18" height="2.5" rx="1.25" fill="#0e2a47"/>
  <!-- plato -->
  <circle cx="13" cy="20.5" r="4.4" fill="#ffffff" stroke="#0e2a47" stroke-width="1.3"/>
  <circle cx="13" cy="20.5" r="2.1" fill="none" stroke="#0e2a47" stroke-width="1"/>
  <!-- tenedor -->
  <path d="M21.5 16.4v2M22.6 16.4v2M23.7 16.4v2M21.5 18.4h2.2" fill="none" stroke="#0e2a47" stroke-width="1.15" stroke-linecap="round"/>
  <path d="M22.6 18.4v5.6" fill="none" stroke="#0e2a47" stroke-width="1.15" stroke-linecap="round"/>
  <!-- patas -->
  <rect x="7" y="28" width="3" height="2" rx="1" fill="#0e2a47"/>
  <rect x="22" y="28" width="3" height="2" rx="1" fill="#0e2a47"/>
